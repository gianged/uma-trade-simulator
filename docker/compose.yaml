services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ../data:/data:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U admin -d app-db
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
